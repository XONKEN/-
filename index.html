<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>燒金紙｜V3.0</title>
<style>
:root{--ink:#3b2114;--gold:#f4c64e;--paper:#fff1bd;--ember:#ff6a20;--night:#2b211c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:#241b17}
body{user-select:none}
#app{position:relative;width:100%;height:100%;min-height:560px;overflow:hidden;background:#c68b4a}
/* detailed illustrated Taiwanese temple street */
#scene{position:absolute;inset:0;background:linear-gradient(#8c5a38 0%,#c58a49 48%,#9d673e 49%,#5a3b2c 100%)}
.sky{position:absolute;inset:0 0 45%;background:linear-gradient(#9f704c,#d5a05a);opacity:.72}
.fog{position:absolute;left:-10%;right:-10%;top:35%;height:18%;background:radial-gradient(ellipse at 20% 50%,rgba(255,230,173,.42),transparent 55%),radial-gradient(ellipse at 70% 45%,rgba(255,226,169,.28),transparent 58%);filter:blur(12px)}
.street{position:absolute;left:0;right:0;bottom:0;height:43%;background:linear-gradient(180deg,#70503d,#3d302a);clip-path:polygon(0 22%,100% 8%,100% 100%,0 100%)}
.street::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(10deg,transparent 0 32px,rgba(255,220,155,.08) 33px 35px),linear-gradient(90deg,rgba(255,235,188,.1),transparent 25%,transparent 75%,rgba(255,235,188,.08))}
.temple{position:absolute;left:50%;top:5%;transform:translateX(-50%);width:min(760px,78vw);height:46%;filter:drop-shadow(0 12px 12px rgba(36,20,10,.3))}
.roof{position:absolute;left:0;right:0;top:0;height:35%;background:linear-gradient(150deg,#5d3025,#9d4328 45%,#5c2b25);clip-path:polygon(0 70%,12% 42%,18% 58%,28% 20%,35% 52%,50% 0,65% 52%,72% 20%,82% 58%,88% 42%,100% 70%,100% 100%,0 100%)}
.roofline{position:absolute;left:4%;right:4%;top:27%;height:7%;background:#e7b85b;border-radius:50%;box-shadow:0 6px 0 #7b3d27}
.templebody{position:absolute;left:13%;right:13%;top:28%;bottom:0;background:linear-gradient(90deg,#d9a054,#f0c56e 48%,#c78343);border:7px solid #6c3826;border-bottom:12px solid #4b2a20;border-radius:8px 8px 2px 2px}
.columns{position:absolute;inset:9% 7% 0;display:flex;justify-content:space-around}.col{width:7%;background:#7e3828;border-radius:3px 3px 0 0;box-shadow:inset 3px 0 rgba(255,215,125,.18)}
.temple-door{position:absolute;left:38%;right:38%;bottom:0;height:57%;background:linear-gradient(90deg,#3e211b,#6b3421 48%,#3e211b);border:5px solid #e6b35b;border-bottom:0;border-radius:70px 70px 0 0}.door-glow{position:absolute;left:45%;right:45%;top:8%;height:80%;background:rgba(255,183,65,.14);filter:blur(10px)}
.lanterns{position:absolute;top:39%;left:22%;right:22%;display:flex;justify-content:space-between}.lantern{width:24px;height:42px;background:#d84827;border:2px solid #f0c56e;border-radius:45% 45% 50% 50%;box-shadow:0 0 14px rgba(255,164,58,.65)}
.sign{position:absolute;top:43%;left:8%;right:8%;height:25%;display:flex;justify-content:center;gap:10px;align-items:center}.sign span{padding:8px 14px;background:#3c241b;color:#f7d57d;border:2px solid #b77736;font-weight:800;letter-spacing:.25em;box-shadow:0 4px 8px rgba(0,0,0,.2)}
.building{position:absolute;bottom:29%;width:18%;height:28%;background:#76513b;border:4px solid #3d2922;box-shadow:0 8px 10px rgba(0,0,0,.18)}.building.l{left:0}.building.r{right:0}.window{position:absolute;left:15%;right:15%;top:20%;height:30%;border:4px solid #4b2c22;background:#dca653;box-shadow:inset 0 0 0 4px #6a3825}
.wires{position:absolute;left:0;right:0;top:18%;height:15%;border-top:2px solid rgba(44,28,23,.5);transform:skewY(-3deg);box-shadow:0 12px 0 rgba(44,28,23,.28)}
.lamp{position:absolute;top:18%;left:16%;width:10px;height:48px;background:#3c2924}.lamp::after{content:"";position:absolute;left:-8px;top:40px;width:26px;height:22px;border-radius:50%;background:#f4ad45;box-shadow:0 0 18px #f4ad45}
/* UI */
.header{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start;z-index:20}.title{font-size:clamp(24px,3vw,42px);font-weight:1000;letter-spacing:.12em;color:#fff2c8;text-shadow:0 3px 0 #5d3022,0 5px 14px rgba(0,0,0,.35)}.badge{background:rgba(49,28,21,.78);border:1px solid rgba(255,220,150,.55);color:#ffe5a2;padding:9px 13px;border-radius:999px;font-weight:800;font-size:13px;backdrop-filter:blur(8px)}
.counter{position:absolute;z-index:20;left:50%;top:16%;transform:translateX(-50%);background:rgba(53,29,21,.76);color:#fff3ca;border:2px solid rgba(244,198,78,.7);padding:12px 24px;border-radius:18px;box-shadow:0 8px 25px rgba(0,0,0,.2);font-size:clamp(18px,2vw,26px);font-weight:900;white-space:nowrap}.counter b{color:#ffd35c;font-size:1.35em}
.furnace{position:absolute;z-index:7;left:50%;bottom:9%;transform:translateX(-50%);width:min(370px,45vw);height:min(245px,29vw);min-height:185px}.roofcap{position:absolute;left:-5%;right:-5%;top:0;height:18%;background:linear-gradient(#7e4330,#4e2921);border:5px solid #d19b4e;border-radius:12px 12px 5px 5px}.bowl{position:absolute;left:6%;right:6%;top:11%;bottom:0;background:linear-gradient(90deg,#4a2822,#8d4d2d 35%,#6b3527 70%,#3c2520);border:7px solid #d09a4d;border-radius:24px 24px 70px 70px;box-shadow:inset 0 12px 20px rgba(255,190,75,.08),0 16px 24px rgba(0,0,0,.35)}.opening{position:absolute;left:16%;right:16%;top:20%;height:44%;border-radius:50%;background:#171111;box-shadow:inset 0 0 0 5px #a76834,inset 0 -10px 30px #ff6a1f}.ash{position:absolute;left:18%;right:18%;bottom:12%;height:22%;background:radial-gradient(ellipse,#b87b3f,#5a3628 70%);border-radius:50%;opacity:.9}.flame{position:absolute;left:31%;right:31%;bottom:28%;height:48%;z-index:4;filter:drop-shadow(0 0 13px #ff9b2f);animation:flicker .7s infinite alternate ease-in-out}.flame::before,.flame::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%) rotate(45deg);border-radius:65% 35% 60% 40%;background:linear-gradient(135deg,#ffe9a0 0 20%,#ffb12f 45%,#ef4e1c 78%);width:58%;height:82%;}.flame::after{width:32%;height:60%;background:linear-gradient(135deg,#fff9cf,#ffd34d 55%,#ff7a20);transform:translateX(-50%) rotate(45deg) translate(-3px,-3px)}
@keyframes flicker{to{transform:scale(1.06,.96) rotate(-1deg)}}
.hand{position:absolute;z-index:14;width:min(300px,31vw);height:auto;left:calc(50% - 250px);bottom:19%;filter:drop-shadow(0 12px 12px rgba(35,18,10,.35));transform-origin:75% 80%;transition:opacity .12s}.hand img{width:100%;display:block;mix-blend-mode:multiply}.hand.throw{animation:handThrow .5s cubic-bezier(.2,.7,.2,1) both}@keyframes handThrow{0%{transform:translate(0,0) rotate(0)}55%{transform:translate(80px,-35px) rotate(-5deg)}100%{transform:translate(125px,-65px) rotate(-9deg);opacity:.15}}
.paper{position:absolute;z-index:16;width:86px;height:112px;background:linear-gradient(135deg,#fff1ae,#e7ad37);border:5px solid #fff0a2;box-shadow:0 5px 15px rgba(60,30,10,.3),inset 0 0 0 3px rgba(167,91,22,.45);display:flex;align-items:center;justify-content:center;transform-origin:center;pointer-events:none}.paper::before{content:"福";font-family:serif;font-size:48px;font-weight:900;color:#a62e1e;border:2px solid #a62e1e;width:54px;height:70px;display:flex;align-items:center;justify-content:center}.paper.throwing{animation:fly .82s cubic-bezier(.2,.75,.25,1) forwards}@keyframes fly{0%{left:calc(50% - 170px);top:58%;transform:rotate(0) scale(1)}35%{left:calc(50% - 105px);top:43%;transform:rotate(12deg) scale(.92)}70%{left:calc(50% - 35px);top:38%;transform:rotate(-9deg) scale(.75)}100%{left:calc(50% - 8px);top:48%;transform:rotate(22deg) scale(.12);opacity:0}}
.controls{position:absolute;z-index:21;left:50%;bottom:3%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(720px,94vw)}button{font:inherit;cursor:pointer;border:1px solid rgba(255,228,160,.6);background:rgba(54,31,22,.86);color:#ffe9ae;border-radius:999px;padding:9px 14px;font-weight:800;box-shadow:0 5px 15px rgba(0,0,0,.22)}button.active{background:#e0a93d;color:#422417;border-color:#ffe8a2}button:active{transform:translateY(1px)}
.credit{position:absolute;z-index:22;bottom:7px;left:50%;transform:translateX(-50%);color:rgba(255,239,195,.92);font-size:12px;letter-spacing:.16em;text-shadow:0 2px 5px #261913}
.hint{position:absolute;z-index:19;left:50%;bottom:27%;transform:translateX(-50%);color:#fff0c6;background:rgba(45,25,18,.58);padding:7px 13px;border-radius:999px;font-size:13px;backdrop-filter:blur(6px);animation:hintFade 4s forwards}.hint.hide{display:none}@keyframes hintFade{0%,65%{opacity:1}100%{opacity:0}}
.puff{position:absolute;z-index:13;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(255,190,75,.45),transparent 65%);animation:puff .6s ease-out forwards;pointer-events:none}@keyframes puff{to{transform:scale(2.2);opacity:0}}
@media(max-width:700px){.title{font-size:22px}.badge{font-size:11px;padding:7px 10px}.temple{width:96vw;top:9%;height:39%}.hand{width:230px;left:calc(50% - 190px);bottom:22%}.furnace{width:310px;height:205px;bottom:10%}.counter{top:15%;padding:9px 16px}.controls{bottom:4.5%}.paper{width:70px;height:90px}.paper::before{font-size:38px;width:44px;height:58px}}
</style>
</head>
<body>
<div id="app">
  <div id="scene"><div class="sky"></div><div class="fog"></div><div class="wires"></div><div class="lamp"></div><div class="building l"><div class="window"></div></div><div class="building r"><div class="window"></div></div>
    <div class="temple"><div class="roof"></div><div class="roofline"></div><div class="templebody"><div class="columns"><i class="col"></i><i class="col"></i><i class="col"></i><i class="col"></i><i class="col"></i></div><div class="temple-door"><div class="door-glow"></div></div><div class="lanterns"><i class="lantern"></i><i class="lantern"></i><i class="lantern"></i><i class="lantern"></i></div><div class="sign"><span>香 火</span></div></div></div>
    <div class="street"></div>
  </div>
  <div class="header"><div class="title">燒金紙</div><div class="badge">VERSION V3.0</div></div>
  <div class="counter">已燒金紙：<b id="count">0</b> 張</div>
  <div class="hint" id="hint">點擊畫面，將金紙送進金爐</div>
  <div class="furnace"><div class="roofcap"></div><div class="bowl"></div><div class="opening"></div><div class="ash"></div><div class="flame" id="flame"></div></div>
  <div class="hand" id="hand"><img src="assets/hand.png" alt="hand"></div>
  <div id="papers"></div>
  <div class="controls" id="controls">
    <button class="active" data-paper="大百壽金">大百壽金</button><button data-paper="刈金">刈金</button><button data-paper="天金">天金</button><button data-paper="銀紙">銀紙</button><button id="sound">🔊 音效開</button>
  </div>
  <div class="credit">MADE BY 永程</div>
</div>
<script>
const app=document.getElementById('app'), papers=document.getElementById('papers'), countEl=document.getElementById('count'), hand=document.getElementById('hand'), flame=document.getElementById('flame'), hint=document.getElementById('hint');
let count=0, soundOn=true, selected='大百壽金', audioCtx=null;
const paperStyles={
 '大百壽金':{bg:'linear-gradient(135deg,#fff0a7,#d99124)',mark:'壽',ink:'#9c2d1f'},
 '刈金':{bg:'linear-gradient(135deg,#fff4c0,#f4b84a)',mark:'刈',ink:'#b13b20'},
 '天金':{bg:'linear-gradient(135deg,#ffe99a,#e0a132)',mark:'天',ink:'#8e301c'},
 '銀紙':{bg:'linear-gradient(135deg,#f4f2df,#9ca3a5)',mark:'銀',ink:'#555'}
};
function ensureAudio(){if(!soundOn)return;if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function noise(duration=.12,filter=1800,volume=.04){ensureAudio();if(!audioCtx)return;const n=audioCtx.sampleRate*duration,b=audioCtx.createBuffer(1,n,audioCtx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const src=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();src.buffer=b;f.type='bandpass';f.frequency.value=filter;f.Q.value=.8;g.gain.setValueAtTime(volume,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);src.connect(f).connect(g).connect(audioCtx.destination);src.start();}
function fireSound(){ensureAudio();if(!audioCtx)return;noise(.35,900,.055);setTimeout(()=>noise(.22,1500,.035),100);setTimeout(()=>noise(.18,600,.025),210)}
function paperSound(){noise(.18,2600,.055);setTimeout(()=>noise(.12,1900,.035),70)}
function setPaper(name){selected=name;document.querySelectorAll('[data-paper]').forEach(b=>b.classList.toggle('active',b.dataset.paper===name));paperSound()}
document.querySelectorAll('[data-paper]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();setPaper(b.dataset.paper)}));
document.getElementById('sound').addEventListener('click',e=>{e.stopPropagation();soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊 音效開':'🔇 音效關';if(soundOn)ensureAudio()});
function createPaper(){const p=document.createElement('div');p.className='paper throwing';const s=paperStyles[selected];p.style.background=s.bg;p.style.setProperty('--ink',s.ink);p.dataset.name=selected;p.innerHTML='<span style="font-family:serif;font-size:42px;font-weight:900;color:'+s.ink+';border:2px solid '+s.ink+';width:58px;height:76px;display:flex;align-items:center;justify-content:center">'+s.mark+'</span>';papers.appendChild(p);paperSound();setTimeout(()=>{count++;countEl.textContent=count;flame.animate([{transform:'scale(1)'},{transform:'scale(1.28,.9)'},{transform:'scale(1)'}],{duration:280,easing:'ease-out'});fireSound();const puff=document.createElement('div');puff.className='puff';puff.style.left='calc(50% - 45px)';puff.style.top='47%';app.appendChild(puff);setTimeout(()=>puff.remove(),650);p.remove()},820)}
function throwPaper(e){if(e.target.closest('button'))return;ensureAudio();hint.classList.add('hide');hand.classList.remove('throw');void hand.offsetWidth;hand.classList.add('throw');createPaper();setTimeout(()=>{hand.classList.remove('throw')},520)}
app.addEventListener('pointerdown',throwPaper,{passive:true});
</script>
</body></html>
