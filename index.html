<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>燒金紙</title>
<style>
:root{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#3d281d;background:#ead5b7}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{user-select:none;-webkit-user-select:none}
button{font:inherit}.game{position:relative;width:100%;height:100%;min-height:560px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#f6dfba 0,#e9c995 55%,#d5ad76 100%);cursor:pointer}
.paper-texture{position:absolute;inset:0;opacity:.13;pointer-events:none;background-image:radial-gradient(#fff 0.7px,transparent .8px);background-size:7px 7px}
.moon{position:absolute;right:8%;top:8%;width:90px;height:90px;border-radius:50%;background:#f7e7c7;box-shadow:0 0 45px rgba(255,226,164,.6)}
.title{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:clamp(26px,5vw,44px);letter-spacing:.18em;font-weight:800;color:#5a3321;text-shadow:2px 2px 0 #f4dcb8;z-index:5}
.counter{position:absolute;top:82px;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:999px;background:rgba(255,247,228,.72);border:2px solid rgba(113,67,34,.22);font-weight:700;font-size:18px;z-index:5}
.scene{position:absolute;inset:0;pointer-events:none}.brazier{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);width:min(48vw,330px);height:min(34vw,230px);min-width:240px;min-height:175px}
.rim{position:absolute;left:5%;right:5%;bottom:29%;height:28%;border-radius:50%;background:#6d4935;border:7px solid #4b3025;box-shadow:inset 0 7px 0 rgba(255,255,255,.12),0 12px 18px rgba(70,37,18,.28)}
.body{position:absolute;left:10%;right:10%;bottom:0;height:62%;background:linear-gradient(90deg,#67412e,#9a6341 45%,#5d3a2a);clip-path:polygon(8% 0,92% 0,82% 100%,18% 100%);border:7px solid #4b3025;border-top:0;border-radius:0 0 28px 28px}
.body:after{content:"";position:absolute;inset:12% 17%;border:3px dashed rgba(255,216,159,.28);border-radius:50%}
.fire{position:absolute;left:50%;bottom:28%;width:50%;height:45%;transform:translateX(-50%);filter:drop-shadow(0 0 16px rgba(255,120,24,.55));animation:flicker .7s ease-in-out infinite alternate}
.flame{position:absolute;left:50%;bottom:0;width:65%;height:100%;transform:translateX(-50%) rotate(2deg);background:linear-gradient(#fff2a1 0 18%,#ffc13d 45%,#e94e25 85%);border-radius:65% 35% 55% 45%/70% 60% 40% 30%;clip-path:polygon(50% 0,68% 30%,96% 44%,77% 66%,73% 100%,30% 100%,22% 70%,4% 48%,33% 31%)}
.flame:after{content:"";position:absolute;left:50%;bottom:5%;width:40%;height:55%;transform:translateX(-50%);background:#fff5bd;border-radius:70% 30% 60% 40%;clip-path:polygon(50% 0,82% 45%,70% 100%,25% 100%,18% 58%)}
@keyframes flicker{from{transform:translateX(-50%) scale(.96) rotate(-1deg)}to{transform:translateX(-50%) scale(1.05) rotate(1deg)}}
.hand{position:absolute;left:8%;bottom:13%;width:190px;height:150px;z-index:3;transform-origin:80% 70%;animation:hand-idle 2.4s ease-in-out infinite}
.hand-shape{position:absolute;left:15px;bottom:4px;width:145px;height:95px;background:#c9825e;border:4px solid #6f412f;border-radius:55% 48% 42% 45%;transform:rotate(-14deg);box-shadow:inset -9px -8px 0 rgba(102,53,34,.1)}
.finger{position:absolute;width:72px;height:25px;background:#d7946c;border:4px solid #6f412f;border-radius:30px;transform:rotate(-22deg)}.f1{left:90px;top:36px}.f2{left:103px;top:56px;transform:rotate(-12deg)}.f3{left:108px;top:78px;transform:rotate(0)}
.paper{position:absolute;left:112px;top:10px;width:58px;height:78px;background:linear-gradient(135deg,#fff0a2,#d9a52d);border:3px solid #8b6322;transform:rotate(12deg);box-shadow:3px 5px 0 rgba(95,55,20,.16)}.paper:before{content:"金";position:absolute;inset:0;display:grid;place-items:center;font-size:30px;color:#9b2e22;font-weight:900}.paper:after{content:"";position:absolute;inset:7px;border:2px dashed rgba(151,87,26,.5)}
.flyer{position:absolute;left:calc(50% - 28px);bottom:24%;width:56px;height:76px;background:linear-gradient(135deg,#fff0a2,#d9a52d);border:3px solid #8b6322;box-shadow:3px 5px 0 rgba(95,55,20,.16);z-index:4;display:none}.flyer:before{content:"金";position:absolute;inset:0;display:grid;place-items:center;font-size:28px;color:#9b2e22;font-weight:900}.flyer:after{content:"";position:absolute;inset:6px;border:2px dashed rgba(151,87,26,.5)}
.flyer.throw{display:block;animation:throw .72s cubic-bezier(.2,.7,.3,1) forwards}@keyframes throw{0%{transform:translate(-145px,85px) rotate(12deg) scale(1)}35%{transform:translate(-90px,-80px) rotate(-20deg) scale(1.02)}70%{transform:translate(-30px,-125px) rotate(24deg) scale(.96)}100%{transform:translate(0,5px) rotate(42deg) scale(.35);opacity:0}}
.hand.throwing{animation:hand-throw .72s ease-out forwards}@keyframes hand-throw{0%{transform:rotate(0)}35%{transform:translate(55px,-25px) rotate(-9deg)}100%{transform:translate(5px,0) rotate(2deg)}}
.fire.burst{animation:burst .38s ease-out}@keyframes burst{50%{transform:translateX(-50%) scale(1.18)}100%{transform:translateX(-50%) scale(1)}}
.hint{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);font-size:15px;color:#704a32;opacity:.78;z-index:5;white-space:nowrap}
@media(max-width:600px){.moon{width:62px;height:62px}.title{top:18px}.counter{top:66px;font-size:16px}.brazier{bottom:16%;width:78vw;height:55vw}.hand{left:-18px;bottom:18%;transform:scale(.82);transform-origin:left bottom}.hint{bottom:5%;font-size:13px}.flyer{bottom:29%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:1ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="game" id="game" aria-label="燒金紙遊戲">
<div class="paper-texture"></div><div class="moon"></div>
<h1 class="title">燒金紙</h1><div class="counter" id="counter">已燒金紙：0 張</div>
<div class="scene">
  <div class="brazier"><div class="fire" id="fire"><div class="flame"></div></div><div class="rim"></div><div class="body"></div></div>
  <div class="hand" id="hand"><div class="hand-shape"></div><div class="finger f1"></div><div class="finger f2"></div><div class="finger f3"></div><div class="paper"></div></div>
  <div class="flyer" id="flyer"></div>
</div>
<div class="hint">點一下，把金紙送進火爐</div>
</main>
<script>
(() => {
  const game = document.getElementById('game');
  const counter = document.getElementById('counter');
  const hand = document.getElementById('hand');
  const flyer = document.getElementById('flyer');
  const fire = document.getElementById('fire');
  let count = 0;
  let sequence = 0;

  function burn() {
    const id = ++sequence;
    const clone = flyer.cloneNode(true);
    clone.id = 'flyer-' + id;
    game.querySelector('.scene').appendChild(clone);
    clone.classList.add('throw');
    hand.classList.remove('throwing');
    void hand.offsetWidth;
    hand.classList.add('throwing');
    fire.classList.remove('burst');
    void fire.offsetWidth;
    fire.classList.add('burst');
    clone.addEventListener('animationend', (event) => {
      if (event.animationName !== 'throw') return;
      clone.remove();
      count += 1;
      counter.textContent = `已燒金紙：${count} 張`;
    }, { once: true });
  }

  game.addEventListener('pointerdown', (event) => {
    if (event.button !== undefined && event.button !== 0 && event.pointerType === 'mouse') return;
    burn();
  });

  window.__burnGame = {
    getCount: () => count,
    click: burn,
    activePapers: () => game.querySelectorAll('.flyer.throw').length
  };

  // Built-in smoke test: /?test=10 runs ten rapid throws and reports PASS.
  if (new URLSearchParams(location.search).get('test') === '10') {
    let checks = 0;
    const interval = setInterval(() => {
      checks += 1;
      burn();
      if (checks === 10) {
        clearInterval(interval);
        setTimeout(() => {
          const pass = count === 10 && game.querySelectorAll('.flyer.throw').length === 0 && counter.textContent === '已燒金紙：10 張';
          document.body.dataset.testResult = pass ? 'PASS' : `FAIL:${count}`;
          document.title = pass ? 'PASS - 燒金紙' : 'FAIL - 燒金紙';
          document.getElementById('counter').textContent += pass ? ' ✓ 測試通過' : ' ✗ 測試失敗';
        }, 1100);
      }
    }, 90);
  }
})();
</script>
</body>
</html>
