<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#e8b35b">
<title>燒金紙｜V2.0</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#241711;color:#fff;touch-action:manipulation}
body{user-select:none;-webkit-user-select:none}
#game{position:relative;width:100%;height:100%;min-height:480px;overflow:hidden;background:linear-gradient(#d9a45b 0%,#b66d3d 45%,#40251d 100%)}
.sky{position:absolute;inset:0 0 43% 0;background:linear-gradient(#f0c983,#e8aa65 62%,#d58650)}
.street{position:absolute;left:0;right:0;bottom:0;height:43%;background:linear-gradient(#8c5b43 0 8%,#5d4038 8% 100%)}
.street:before{content:"";position:absolute;inset:7% 0 0;background:repeating-linear-gradient(100deg,transparent 0 78px,rgba(255,220,154,.08) 79px 82px,transparent 83px 160px)}
.street:after{content:"";position:absolute;left:0;right:0;bottom:10%;height:4px;background:rgba(255,224,161,.28);box-shadow:0 18px 0 rgba(0,0,0,.12)}
.moon{position:absolute;right:9%;top:9%;width:58px;height:58px;border-radius:50%;background:#ffe5ad;box-shadow:0 0 28px rgba(255,226,157,.45)}
.temple{position:absolute;left:50%;top:7%;transform:translateX(-50%);width:min(68vw,650px);height:40%;filter:drop-shadow(0 9px 7px rgba(65,29,16,.22))}
.roof{position:absolute;left:4%;right:4%;top:0;height:30%;background:#7b2720;clip-path:polygon(0 58%,8% 42%,16% 48%,25% 18%,50% 0,75% 18%,84% 48%,92% 42%,100% 58%,91% 75%,9% 75%);border-bottom:6px solid #e1a54f}
.roof:after{content:"";position:absolute;left:8%;right:8%;bottom:10%;height:5px;background:#f3c56c;box-shadow:0 8px #8c3827}
.temple-body{position:absolute;left:13%;right:13%;top:24%;bottom:0;background:#d99b5a;border:5px solid #8b432b;border-bottom:0;border-radius:8px 8px 0 0}
.temple-body:before{content:"宮";position:absolute;left:50%;top:8%;transform:translateX(-50%);font-size:clamp(28px,5vw,55px);font-weight:900;color:#6e251d;text-shadow:1px 1px #f5cc83}
.column{position:absolute;top:24%;bottom:0;width:8%;background:#8a3527;border-left:3px solid #e2a258;border-right:3px solid #67241e}.column.l{left:13%}.column.r{right:13%}
.door{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:22%;height:48%;background:#4e2b26;border:5px solid #8a3c29;border-radius:5px 5px 0 0}.door:after{content:"";position:absolute;left:50%;top:50%;height:70%;width:2px;background:#b06c43}
.lantern{position:absolute;top:28%;width:28px;height:46px;background:#e8a64f;border:3px solid #7d2c20;border-radius:8px;box-shadow:0 0 12px #ffd37d}.lantern:after{content:"";position:absolute;left:50%;top:-15px;height:15px;border-left:2px solid #6f2a20}.lantern.a{left:25%}.lantern.b{right:25%}
.shop{position:absolute;bottom:19%;width:18%;height:25%;background:#a66a48;border:3px solid #633d34;border-radius:5px}.shop:before{content:"香火\A 金紙";white-space:pre;text-align:center;position:absolute;left:0;right:0;top:8%;font-weight:900;color:#ffe0a2;font-size:clamp(10px,1.5vw,18px)}.shop:after{content:"";position:absolute;left:-5%;right:-5%;bottom:0;height:36%;background:#4c3330;border-top:3px solid #e0a25a}.shop.s1{left:3%}.shop.s2{right:3%;width:20%}
.wire{position:absolute;left:0;right:0;top:18%;height:2px;background:#56352e;transform:rotate(-2deg)}.wire:before,.wire:after{content:"";position:absolute;top:0;width:8px;height:70px;background:#70443a}.wire:before{left:12%}.wire:after{right:13%}
.hud{position:absolute;z-index:20;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;padding:11px 20px;border-radius:18px;background:rgba(56,28,19,.72);backdrop-filter:blur(5px);border:1px solid rgba(255,226,166,.3);box-shadow:0 8px 24px rgba(48,22,12,.2)}
.count{font-weight:900;font-size:clamp(19px,3vw,30px);letter-spacing:.04em;color:#ffe5ae;text-shadow:0 2px 4px #57291d}.hint{font-size:12px;opacity:.8;margin-top:2px}
.version{position:absolute;z-index:25;right:14px;top:max(14px,env(safe-area-inset-top));padding:7px 11px;border-radius:12px;background:rgba(50,25,18,.76);border:1px solid rgba(255,226,166,.28);font-size:12px;font-weight:800;color:#ffd98d;letter-spacing:.08em}.sound{position:absolute;z-index:25;right:14px;top:58px;border:1px solid rgba(255,226,166,.28);background:rgba(50,25,18,.76);color:#ffe0a4;border-radius:12px;padding:7px 10px;cursor:pointer}
.selector{position:absolute;z-index:25;left:50%;bottom:90px;transform:translateX(-50%);display:flex;gap:7px;padding:8px;background:rgba(48,26,19,.75);border:1px solid rgba(255,226,166,.25);border-radius:16px;backdrop-filter:blur(5px)}.paper-btn{border:1px solid rgba(255,224,156,.25);background:rgba(255,213,133,.09);color:#ffe4af;border-radius:11px;padding:7px 10px;font-size:12px;cursor:pointer}.paper-btn.active{background:#d99437;color:#3e2118;border-color:#ffe0a0;font-weight:900}
.made{position:absolute;z-index:25;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12px;letter-spacing:.16em;color:rgba(255,231,185,.78);white-space:nowrap;text-shadow:0 2px 4px #3d2019}
.brazier{position:absolute;z-index:10;left:50%;bottom:18%;transform:translateX(-50%);width:min(46vw,360px);height:min(34vw,260px);min-width:220px;min-height:170px}.rim{position:absolute;left:0;right:0;bottom:21%;height:25%;border-radius:50%;background:linear-gradient(#6e4a37,#321f1b);border:7px solid #a56a3f;box-shadow:0 15px 25px rgba(20,10,7,.35)}.body{position:absolute;left:8%;right:8%;bottom:0;height:46%;background:linear-gradient(90deg,#43251e,#7e4830,#43251e);clip-path:polygon(8% 0,92% 0,82% 100%,18% 100%);border-bottom:6px solid #2d1916}.leg{position:absolute;bottom:-2%;width:13%;height:25%;background:#39201b}.leg.l{left:16%}.leg.r{right:16%}.fire{position:absolute;left:50%;bottom:29%;transform:translateX(-50%);width:48%;height:55%;filter:drop-shadow(0 0 16px rgba(255,161,49,.65))}.flame{position:absolute;bottom:0;left:50%;width:44%;height:80%;transform:translateX(-50%);background:#ffbf47;clip-path:polygon(50% 0,67% 28%,82% 16%,78% 53%,100% 63%,76% 100%,24% 100%,0 64%,23% 55%,19% 27%,35% 39%);animation:flicker .55s infinite alternate;transform-origin:50% 100%}.flame:after{content:"";position:absolute;left:31%;bottom:0;width:38%;height:68%;background:#fff0a3;clip-path:polygon(50% 0,80% 36%,100% 50%,75% 100%,25% 100%,0 52%,24% 34%)}@keyframes flicker{to{transform:translateX(-50%) scale(.94,1.07) rotate(1deg)}}
.hand{position:absolute;z-index:13;left:50%;bottom:10%;width:min(30vw,235px);height:min(34vw,260px);transform:translateX(-145%) rotate(-5deg);transform-origin:80% 80%;pointer-events:none;transition:filter .2s}.skin{position:absolute;right:2%;bottom:0;width:58%;height:76%;background:linear-gradient(145deg,#f1bd83,#c8794f);border:4px solid #733c2b;border-radius:48% 50% 34% 46%;box-shadow:inset -10px -12px 0 rgba(101,43,31,.1)}.finger{position:absolute;right:36%;bottom:54%;width:26%;height:48%;background:#df9865;border:4px solid #733c2b;border-radius:60% 60% 35% 35%;transform:rotate(-23deg)}.finger.f2{right:18%;bottom:48%;height:52%;transform:rotate(-3deg)}.finger.f3{right:4%;bottom:42%;height:47%;transform:rotate(16deg)}.thumb{position:absolute;right:42%;bottom:38%;width:31%;height:30%;background:#d98c5d;border:4px solid #733c2b;border-radius:60% 30% 50% 45%;transform:rotate(35deg)}.nail{position:absolute;right:10%;top:8%;width:42%;height:25%;background:#f7d5b0;border:2px solid #ad6b4c;border-radius:50%}.wrist{position:absolute;right:-5%;bottom:-3%;width:44%;height:25%;background:#bd704c;border:4px solid #733c2b;transform:rotate(-13deg);border-radius:20%}.paper{position:absolute;z-index:14;width:70px;height:92px;left:50%;top:50%;transform:translate(-50%,-50%);filter:drop-shadow(0 5px 5px rgba(57,23,14,.35));cursor:pointer}.paper .fold{position:absolute;inset:0;background:linear-gradient(145deg,#ffe9a4,#d99632);border:3px solid #9a5a22;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%);box-shadow:inset 0 0 0 4px rgba(255,239,169,.35)}.paper .mark{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:25px;font-weight:900;color:#a25b1d}.paper .spark{position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(255,223,121,.6);opacity:0}
.fly{position:absolute;z-index:18;pointer-events:none;width:56px;height:74px;animation:throw .78s cubic-bezier(.2,.68,.2,1) forwards}.fly .paper{position:relative;left:0;top:0;width:56px;height:74px;transform:none}.fly.burn{animation:throwburn .82s cubic-bezier(.2,.68,.2,1) forwards}.fly.burn .paper{animation:paperflip .82s linear forwards}.fly.burn .paper .spark{animation:spark .82s ease-out forwards}@keyframes throw{0%{transform:translate(0,0) rotate(-8deg) scale(1)}45%{transform:translate(-25px,-110px) rotate(18deg) scale(.96)}100%{transform:translate(0,-235px) rotate(42deg) scale(.68);opacity:0}}@keyframes throwburn{0%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(4px,-125px) rotate(18deg)}82%{transform:translate(0,-210px) rotate(35deg) scale(.78)}100%{transform:translate(0,-220px) rotate(52deg) scale(.25);opacity:0}}@keyframes paperflip{to{filter:brightness(1.6) sepia(1)}}@keyframes spark{40%{opacity:1;transform:scale(.7)}100%{opacity:0;transform:scale(1.5)}}
.flash{position:absolute;z-index:17;left:50%;bottom:28%;width:180px;height:100px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(255,227,132,.5),transparent 65%);opacity:0;pointer-events:none}.flash.on{animation:flash .35s ease-out}@keyframes flash{0%{opacity:0;transform:translateX(-50%) scale(.8)}35%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1.2)}}
@media(max-width:600px){.temple{width:92vw;height:38%}.brazier{bottom:18%;width:70vw}.hand{width:45vw;transform:translateX(-150%) rotate(-5deg)}.selector{bottom:76px;max-width:94vw;overflow-x:auto}.paper-btn{padding:7px 8px}.made{bottom:8px}.shop{display:none}.version{top:12px}.sound{top:53px}}
</style>
</head>
<body>
<div id="game" aria-label="燒金紙遊戲">
<div class="sky"></div><div class="moon"></div><div class="wire"></div>
<div class="temple"><div class="roof"></div><div class="temple-body"></div><div class="column l"></div><div class="column r"></div><div class="door"></div><div class="lantern a"></div><div class="lantern b"></div></div>
<div class="street"><div class="shop s1"></div><div class="shop s2"></div></div>
<div class="hud"><div class="count" id="count">已燒金紙：0 張</div><div class="hint">點一下，把金紙送進香爐</div></div>
<div class="version">VERSION V2.0</div><button class="sound" id="sound">🔊 音效開</button>
<div class="brazier"><div class="fire"><div class="flame"></div></div><div class="rim"></div><div class="body"></div><div class="leg l"></div><div class="leg r"></div></div>
<div class="flash" id="flash"></div>
<div class="hand"><div class="wrist"></div><div class="skin"></div><div class="finger"><i class="nail"></i></div><div class="finger f2"><i class="nail"></i></div><div class="finger f3"><i class="nail"></i></div><div class="thumb"><i class="nail"></i></div><div class="paper" id="held"><div class="fold"></div><div class="mark">金</div><div class="spark"></div></div></div>
<div id="flights"></div>
<div class="selector" id="selector"></div>
<div class="made">MADE BY 永程</div>
</div>
<script>
(()=>{
'use strict';
const papers=[['大金元寶','元'],['刈金','刈'],['天金','天'],['銀紙','銀']];
let selected=0,count=0,soundOn=true,audio=null;
const countEl=document.getElementById('count'), flights=document.getElementById('flights'), held=document.getElementById('held'), flash=document.getElementById('flash'), selector=document.getElementById('selector'), sound=document.getElementById('sound');
function makeSelector(){papers.forEach((p,i)=>{const b=document.createElement('button');b.className='paper-btn'+(i===0?' active':'');b.textContent=p[0];b.dataset.i=i;b.addEventListener('click',e=>{e.stopPropagation();selected=i;document.querySelectorAll('.paper-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');held.querySelector('.mark').textContent=p[1]});selector.appendChild(b)})}
function initAudio(){if(audio)return;audio=new (window.AudioContext||window.webkitAudioContext)()}
function tone(freq,dur,type='sine',gain=.04){if(!soundOn)return;try{initAudio();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function burnSound(){tone(180,.08,'triangle',.05);setTimeout(()=>tone(480,.16,'sine',.035),35);setTimeout(()=>tone(720,.22,'sine',.018),85)}
function throwPaper(){
 if(soundOn){try{initAudio();if(audio.state==='suspended')audio.resume();}catch(e){}}
 const el=document.createElement('div');el.className='fly burn';const p=document.createElement('div');p.className='paper';const f=document.createElement('div');f.className='fold';const m=document.createElement('div');m.className='mark';m.textContent=papers[selected][1];const s=document.createElement('div');s.className='spark';p.append(f,m,s);el.appendChild(p);
 const hand=document.querySelector('.hand').getBoundingClientRect();el.style.left=(hand.left+hand.width*.64)+'px';el.style.top=(hand.top+hand.height*.18)+'px';flights.appendChild(el);tone(330,.06,'triangle',.025);
 setTimeout(()=>{count++;countEl.textContent='已燒金紙：'+count+' 張';flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');burnSound()},650);
 setTimeout(()=>el.remove(),900);
}
document.getElementById('game').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;throwPaper()});
sound.addEventListener('click',e=>{e.stopPropagation();soundOn=!soundOn;sound.textContent=soundOn?'🔊 音效開':'🔇 音效關';if(soundOn){try{initAudio();audio.resume()}catch(_){}}});
makeSelector();
// deterministic smoke test: index.html?test=10
if(new URLSearchParams(location.search).get('test')==='10'){
 let n=0;const t=setInterval(()=>{throwPaper();n++;if(n>=10)clearInterval(t)},120);
 setTimeout(()=>{document.body.dataset.testResult=(count===10?'PASS':'FAIL')},1900)
}
window.__game={get count(){return count},get selected(){return selected},throwPaper,papers};
})();
</script>
</body>
</html>
