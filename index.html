.counter{{position:absolute;z-index:15;top:92px;left:50%;transform:translateX(-50%);background:rgba(46,24,10,.74);border:1px solid rgba(255,220,145,.48);box-shadow:0 8px 28px rgba(0,0,0,.35);border-radius:18px;padding:11px 20px;text-align:center;backdrop-filter:blur(5px)}}
.counter small{{display:block;opacity:.8;font-size:11px;letter-spacing:.15em}}.count{{font-size:clamp(25px,4.5vw,42px);font-weight:950;color:#ffe6a4}}
.paper-panel{{position:absolute;z-index:30;left:50%;bottom:62px;transform:translateX(-50%);width:min(94vw,820px);background:rgba(36,19,9,.82);border:1px solid rgba(255,220,150,.42);border-radius:20px;padding:12px 14px;backdrop-filter:blur(8px);box-shadow:0 14px 45px rgba(0,0,0,.4)}}
.label{{font-size:12px;opacity:.85;margin:0 0 8px 4px;letter-spacing:.08em}}.papers{{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}}.paper-btn{{flex:0 0 auto;min-width:90px;border:1px solid rgba(255,229,164,.25);border-radius:12px;background:rgba(255,255,255,.06);color:#fff;padding:8px 9px;cursor:pointer;transition:.18s transform,.18s background,.18s border-color}}.paper-btn:hover{{transform:translateY(-2px)}}.paper-btn.active{{background:rgba(205,126,31,.34);border-color:#ffd77d;box-shadow:0 0 0 2px rgba(255,215,125,.12)}}.swatch{{height:34px;border-radius:8px;margin-bottom:6px;display:grid;place-items:center;font-weight:900;font-size:13px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}}
.fire{{position:absolute;z-index:8;left:50%;bottom:24%;transform:translateX(-50%);width:min(39vw,330px);height:min(29vw,235px);min-width:230px;min-height:165px;pointer-events:none}}.fire .glow{{position:absolute;left:50%;bottom:7%;width:80%;height:70%;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(255,164,46,.45),transparent 67%);filter:blur(15px)}}.flame{{position:absolute;left:50%;bottom:18%;transform:translateX(-50%);width:54%;height:68%;background:radial-gradient(ellipse at 50% 80%,#fff0a2 0 10%,#ffc34f 22%,#e86524 55%,transparent 72%);filter:blur(1px);animation:flicker .65s infinite alternate ease-in-out}}.flame:before,.flame:after{{content:"";position:absolute;bottom:8%;border-radius:55% 45% 60% 40%;transform-origin:bottom center}}.flame:before{{left:8%;width:42%;height:72%;background:#ffbd3e;transform:rotate(-14deg)}}.flame:after{{right:7%;width:39%;height:68%;background:#ff7a27;transform:rotate(15deg)}}@keyframes flicker{{from{{transform:translateX(-50%) scale(.96) rotate(-1deg)}}to{{transform:translateX(-50%) scale(1.04) rotate(1deg)}}}}
.brazier{{position:absolute;z-index:9;left:50%;bottom:14%;transform:translateX(-50%);width:min(34vw,300px);height:min(15vw,120px);min-width:210px;min-height:84px;border-radius:50% 50% 18% 18%;background:linear-gradient(#8b6b4e,#33251d 70%);border:5px solid #9d7d59;box-shadow:inset 0 8px 16px rgba(0,0,0,.55),0 14px 25px rgba(0,0,0,.5)}.brazier:before{{content:"";position:absolute;left:10%;right:10%;top:-16%;height:32%;border-radius:50%;background:#20150f;border:4px solid #a5825b;box-shadow:inset 0 5px 12px #000}}.brazier:after{{content:"祈福";position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);font-weight:900;color:#e8c98e;opacity:.7;letter-spacing:.2em}}
.hand{{position:absolute;z-index:14;left:8%;bottom:11%;width:clamp(150px,20vw,250px);height:clamp(210px,31vw,360px);filter:drop-shadow(0 16px 15px rgba(0,0,0,.35));transform-origin:70% 90%;pointer-events:none}}.hand svg{{width:100%;height:100%;overflow:visible}}.throwing{{animation:throwHand .58s cubic-bezier(.3,.8,.3,1)}}@keyframes throwHand{{0%{{transform:translate(0,0) rotate(0)}}55%{{transform:translate(10vw,-6vh) rotate(-7deg)}}100%{{transform:translate(5vw,0) rotate(2deg)}}}}
.paper-flight{{position:absolute;z-index:16;width:82px;height:108px;pointer-events:none;filter:drop-shadow(0 7px 7px rgba(0,0,0,.45));transform-origin:center}}.paper-sheet{{width:100%;height:100%;border:5px solid #f5d77d;background:#b71d17;box-shadow:inset 0 0 0 4px #ffd96d,inset 0 0 0 10px #9b1714;border-radius:4px;display:grid;place-items:center;color:#ffd96d;font-size:26px;font-weight:950;text-shadow:0 2px 2px #65110d}}
.toast{{position:absolute;z-index:50;left:50%;top:18%;transform:translate(-50%,-20px);opacity:0;padding:9px 16px;border-radius:999px;background:rgba(27,12,5,.8);border:1px solid rgba(255,222,145,.45);font-weight:800;pointer-events:none;transition:.25s}}.toast.show{{opacity:1;transform:translate(-50%,0)}}
.footer{{position:absolute;z-index:25;bottom:12px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.25em;color:#ffe5b0;text-shadow:0 2px 7px #000;font-weight:800}}.sound{{position:absolute;z-index:30;right:18px;top:62px;border:1px solid rgba(255,220,150,.35);background:rgba(27,14,8,.72);color:#fff;padding:8px 11px;border-radius:10px;cursor:pointer}}
.hint{{position:absolute;z-index:12;left:50%;bottom:42%;transform:translateX(-50%);font-size:14px;font-weight:800;opacity:.88;text-shadow:0 2px 7px #000;pointer-events:none;white-space:nowrap}}
@media(max-width:700px){{.topbar{{top:10px;left:10px;right:10px}}.title{{font-size:20px;padding:8px 11px}}.version{{font-size:10px;padding:7px 9px}}.counter{{top:66px;padding:8px 15px}}.sound{{top:58px;right:10px}}.hand{{left:1%;bottom:10%;width:145px;height:205px}}.fire{{bottom:27%;width:62vw;height:42vw}}.brazier{{bottom:18%;width:58vw;height:22vw}}.hint{{bottom:48%;font-size:12px}}.paper-panel{{bottom:38px;padding:9px 10px;border-radius:15px}}.paper-btn{{min-width:78px;padding:6px 7px;font-size:11px}}.swatch{{height:28px}}.footer{{bottom:7px;font-size:9px}}}}
</style></head><body><main class="game" id="game"><div class="bg"></div><div class="vignette"></div>
<div class="topbar"><div class="title">燒金紙</div><div class="version">VERSION V4.0</div></div><button class="sound" id="soundBtn">🔊 音效 ON</button>
<div class="counter"><small>已燒金紙</small><div class="count" id="count">0 張</div></div>
<div class="hint" id="hint">點擊畫面・把金紙送入香火</div>
<div class="fire"><div class="glow"></div><div class="flame" id="flame"></div></div><div class="brazier"></div>
<div class="hand" id="hand"><svg viewBox="0 0 220 330" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1bd8f"/><stop offset=".55" stop-color="#d68e64"/><stop offset="1" stop-color="#a95f45"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0a1"/><stop offset=".45" stop-color="#e4a52d"/><stop offset="1" stop-color="#9b4a11"/></linearGradient></defs><path d="M78 318c-8-26-7-54-5-77 2-26 7-47 12-67 5-18 2-29-7-46-8-15-17-35-11-42 5-6 13-3 19 7l20 36-4-79c0-11 7-18 14-16 6 2 8 8 8 16l3 64 8-92c1-10 8-15 15-13 7 2 9 8 8 18l-3 83 13-69c2-10 9-14 16-11 7 3 8 10 6 19l-12 69 19-48c4-9 11-11 17-7 6 4 6 11 3 20l-24 73c-6 18-11 31-15 45-5 17-1 36 8 57l10 24z" fill="url(#skin)" stroke="#7e4937" stroke-width="4"/><path d="M83 139c16 17 35 22 58 13M99 161c15 9 31 10 47 4M106 188c12 6 25 6 36 1" fill="none" stroke="#9e604a" stroke-width="4" stroke-linecap="round" opacity=".7"/><path d="M83 92l12 23M117 77l2 28M148 69l-6 29M172 86l-11 25" stroke="#f7c9a0" stroke-width="4" stroke-linecap="round" opacity=".7"/><g transform="translate(35 118) rotate(-8)"><path d="M0 0h68l10 90H10z" fill="url(#gold)" stroke="#6d3a13" stroke-width="4"/><rect x="10" y="11" width="48" height="66" rx="2" fill="#c51c16" stroke="#ffe38b" stroke-width="5"/><text x="34" y="56" text-anchor="middle" font-size="26" font-weight="900" fill="#ffe38b">金</text><path d="M7 7h55M13 83h52" stroke="#fff2b2" stroke-width="3"/></g></svg></div>
<div class="paper-panel"><div class="label">選擇金紙種類</div><div class="papers" id="papers"></div></div><div class="toast" id="toast">功德 +1</div><div class="footer">MADE BY 永程</div></main>
<script>
const TYPES=[['大百壽金','壽','主祭祈福','#b81d17'],['刈金','刈','常用金紙','#c98b22'],['天金','天','敬天祈福','#d8b13b'],['大銀','銀','祭祀銀紙','#b8bec5'],['小銀','小','小額銀紙','#c8cdd2'],['九金','九','九金祈福','#d99b25'],['福金','福','添福祈願','#c9791c'],['壽金','壽','祝壽祈願','#b82a20']];
let selected=0,count=0,soundOn=true,audio=null;
const papers=document.getElementById('papers');
TYPES.forEach((t,i)=>{const b=document.createElement('button');b.className='paper-btn'+(i===0?' active':'');b.innerHTML=`<div class="swatch" style="background:${t[3]}">${t[1]}</div>${t[0]}`;b.title=t[2];b.onclick=()=>{selected=i;document.querySelectorAll('.paper-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');paperRustle(.18)};papers.appendChild(b)});
function audioCtx(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}
function noise(duration=.25,filter=1800,gain=.045){const c=audioCtx(),n=c.createBufferSource(),buf=c.createBuffer(1,c.sampleRate*duration,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);n.buffer=buf;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=filter;f.Q.value=.7;const g=c.createGain();g.gain.setValueAtTime(gain,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+duration);n.connect(f).connect(g).connect(c.destination);n.start();n.stop(c.currentTime+duration)}
function paperRustle(v=.22){if(!soundOn)return;noise(.16,2400,v);noise(.09,5200,v*.55)}
function burnSound(){if(!soundOn)return;const c=audioCtx();const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.setValueAtTime(115,c.currentTime);o.frequency.exponentialRampToValueAtTime(55,c.currentTime+.7);g.gain.setValueAtTime(.001,c.currentTime);g.gain.exponentialRampToValueAtTime(.08,c.currentTime+.05);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.75);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.75);noise(.55,850,.065);noise(.35,1800,.035)}
function setCount(n){count=n;document.getElementById('count').textContent=n+' 張'}
function throwPaper(){
 const game=document.getElementById('game'),hand=document.getElementById('hand'),flame=document.getElementById('flame'),hint=document.getElementById('hint');hint.style.opacity='.0';
 paperRustle(.28);hand.classList.remove('throwing');void hand.offsetWidth;hand.classList.add('throwing');
 const p=document.createElement('div');p.className='paper-flight';p.innerHTML=`<div class="paper-sheet">${TYPES[selected][1]}</div>`;game.appendChild(p);
 const gr=game.getBoundingClientRect();const hx=gr.width*.18, hy=gr.height*.62;const tx=gr.width*.50, ty=gr.height*.58;const start=performance.now(),dur=760+Math.random()*160;
 function frame(now){let q=Math.min(1,(now-start)/dur);let e=q<.5?2*q*q:1-Math.pow(-2*q+2,2)/2;let x=hx+(tx-hx)*e;let arc=Math.sin(Math.PI*q)*gr.height*.22;let y=hy+(ty-hy)*e-arc;let rot=-14+q*120;p.style.left=(x-41)+'px';p.style.top=(y-54)+'px';p.style.transform=`rotate(${rot}deg) scale(${1-.16*q})`;if(q<1)requestAnimationFrame(frame);else{p.remove();flame.style.animation='none';flame.style.transform='translateX(-50%) scale(1.18)';setTimeout(()=>{flame.style.animation='';flame.style.transform='';},180);burnSound();setCount(count+1);const toast=document.getElementById('toast');toast.textContent=`${TYPES[selected][0]}・功德 +1`;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),520)}}requestAnimationFrame(frame)
}
let last=0;document.getElementById('game').addEventListener('pointerdown',e=>{if(e.target.closest('.paper-btn,.sound'))return;const now=performance.now();if(now-last<35)return;last=now;throwPaper()});
document.getElementById('soundBtn').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊 音效 ON':'🔇 音效 OFF';if(soundOn)paperRustle(.12)};
</script></body></html>
